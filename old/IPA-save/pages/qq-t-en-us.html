<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ Testflight</title>
    <link rel="stylesheet" href="../../global-variables.css">
    <link rel="icon" href="../images/qq-t.png" type="image/png" />
    <script>
        (function(){
            try {
                if (localStorage.getItem('darkMode') === 'true') {
                    document.documentElement.classList.add('dark-mode');
                }
            } catch (e) { }
        })();
    </script>
</head>
<body>
    <br>
    <div class="top-controls">
      <a class="top-link" href="../index.html"><button class="button-func">Go Back</button></a>
      <a class="top-link" href="javascript:void(0)">
            <button class="button-func" onclick="toggleDarkMode()">
                    Appearance
                </button>
            </a>
    </div>
    <div class="responsive-table-wrapper">
      <h2>About this Application</h2>
  <table>
    <tr>
      <td>Application Name</td>
      <td>QQ</td>
    </tr>
    <tr>
      <td>Seller</td>
      <td>Tencent Technology (Shenzhen) Company Limited</td>
    </tr>
    <tr>
      <td>Bundle Identifier</td>
      <td>com.tencent.mqq</td>
    </tr>
    <tr>
      <td>Testflight Invite Link</td>
      <td><a href="https://testflight.apple.com/join/R5FNGUl3">https://testflight.apple.com/join/R5FNGUl3</a></td>
    </tr>
    <tr>
      <td>Developer Website</td>
      <td><a href="https://im.qq.com/index/#">https://im.qq.com/index/#</a></td>
    </tr>
  </table>
  </div>
  <br>
  <script src="../../dark-mode.js"></script>
    <div id="buttonContainer"></div>
    <div class="responsive-table-wrapper">
  <div id="tableContainer"></div>
</div>
<script>
function loadJSON(callback) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '../../../../IPA-save/data/qq-t.json', true);
  xhr.responseType = 'text';

  xhr.onload = function () {
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        callback(null, data);
      } catch (e) {
        callback(new Error('Invalid JSON: ' + e.message));
      }
    } else {
      callback(new Error('Could not fetch JSON'));
    }
  };

  xhr.onerror = function () {
    callback(new Error('Network error'));
  };

  xhr.send();
}

function convertToLink(text) {
  if (typeof text !== 'string') return text;

  if (text.match(/^itms-services:\/\/\?action=download-manifest&url=/i)) {
    return '<a href="' + text + '">Download</a>';
  }

  if (text.match(/^(https?:\/\/|ftp:\/\/)/i)) {
    return '<a href="' + text + '" target="_blank">Download</a>';
  }

  return text;
}

function init() {
  loadJSON(function (err, data) {
    var btnContainer = document.getElementById('buttonContainer');

    if (err) {
      btnContainer.innerHTML =
        '<p style="color:red;">' + err.message + '</p>';
      return;
    }

    btnContainer.innerHTML = '<b>Choose a type:</b><br>';

    for (var groupName in data) {
      if (!data.hasOwnProperty(groupName)) continue;

      (function (name) {
        var btn = document.createElement('button');
        btn.textContent = name;
        btn.className = 'sheet-btn';
        btn.onclick = function () {
          showGroup(data, name);
        };
        btnContainer.appendChild(btn);
      })(groupName);
    }
  });
}

function showGroup(data, groupName) {
  var rows = data[groupName];
  var container = document.getElementById('tableContainer');

  if (!Array.isArray(rows) || rows.length === 0) {
    container.innerHTML = '<p>No data available</p>';
    return;
  }

  var headers = Object.keys(rows[0]);
  var html = '<h3>' + groupName + '</h3><table>';

  html += '<tr>';
  for (var i = 0; i < headers.length; i++) {
    html += '<th>' + headers[i] + '</th>';
  }
  html += '</tr>';

  for (var r = 0; r < rows.length; r++) {
    html += '<tr>';
    for (var c = 0; c < headers.length; c++) {
      var cell = convertToLink(rows[r][headers[c]]);
      html += '<td>' + (cell !== undefined ? cell : '') + '</td>';
    }
    html += '</tr>';
  }

  html += '</table>';
  container.innerHTML = html;
}

if (window.addEventListener) {
  window.addEventListener('load', init, false);
} else if (window.attachEvent) {
  window.attachEvent('onload', init);
} else {
  window.onload = init;
}
</script>
</body>
</html>
